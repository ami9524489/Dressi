name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        run: npm ci || npm install
        working-directory: functions

      - name: Write deploy credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Store the Gemini key in Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/gk.txt"
          npx -y firebase-tools@13 functions:secrets:set GEMINI_API_KEY \
            --data-file "$RUNNER_TEMP/gk.txt" --project dressi-5f536 --non-interactive --force
          rm -f "$RUNNER_TEMP/gk.txt"

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@13 deploy --project dressi-5f536 --non-interactive --force

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
